name: Verify assignment
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: final_task_test
          POSTGRES_PASSWORD: ci_disposable_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d final_task_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:ci_disposable_password@localhost:5432/final_task_test
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:integration
      - run: npm run test:roles
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: docker build -t final-task .
