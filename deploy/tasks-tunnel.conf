# Install only after creating tasks-tunnel and its authorized_keys.
# Validate with sshd -t before reloading SSH; keep the admin session open.
Match User tasks-tunnel
    AuthenticationMethods publickey
    PasswordAuthentication no
    AllowTcpForwarding local
    PermitOpen 127.0.0.1:5432
    AllowStreamLocalForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTTY no
    PermitTunnel no
    PermitUserRC no
    MaxSessions 0
