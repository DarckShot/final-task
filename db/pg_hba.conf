# The reviewer can authenticate only to the assignment database.
# These rules precede PostgreSQL's general rules and cover future databases too.
local all tasks_reviewer reject
host tasks_db tasks_reviewer all scram-sha-256
host all tasks_reviewer all reject

# Other roles use the usual local bootstrap and password-authenticated network access.
local all all trust
host all all 127.0.0.1/32 trust
host all all ::1/128 trust
local replication all trust
host replication all 127.0.0.1/32 trust
host replication all ::1/128 trust
host all all all scram-sha-256
